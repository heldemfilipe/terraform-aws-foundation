name: plan

# Sem filtro de paths: o check "plan" é obrigatório na main e, se o workflow
# não rodasse num PR de documentação, o merge ficaria preso esperando por ele.
on: pull_request

# Um plan novo cancela o anterior do mesmo PR.
concurrency:
  group: plan-${{ github.ref }}
  cancel-in-progress: true

# Só o necessário: OIDC para assumir a role e comentar no PR.
permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  AWS_REGION: us-east-1
  TF_IN_AUTOMATION: "true"
  TF_VAR_account_id: ${{ vars.AWS_ACCOUNT_ID }}

jobs:
  plan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: envs/dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false

      - name: init
        run: |
          terraform init -lockfile=readonly \
            -backend-config="bucket=${{ vars.STATE_BUCKET }}" \
            -backend-config="region=${AWS_REGION}"

      - name: fmt
        run: terraform fmt -check -recursive
        working-directory: .

      - name: validate
        run: terraform validate

      - name: plan
        run: terraform plan -out=plan.tfplan -no-color

      - name: plan em texto e em JSON
        run: |
          terraform show -no-color plan.tfplan > plan.txt
          terraform show -json plan.tfplan > plan.json

      - name: instala o conftest
        working-directory: .
        env:
          CONFTEST_VERSION: 0.71.1
          CONFTEST_SHA256: c3f6b2a753bd56e377a1e51a95ae3e057f926f2e9139f7d5b5dfbbaf810f7985
        run: |
          curl -sSfL -o conftest.tar.gz \
            "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz"
          echo "${CONFTEST_SHA256}  conftest.tar.gz" | sha256sum --check
          tar -xzf conftest.tar.gz conftest
          sudo install conftest /usr/local/bin/conftest

      - name: testa as políticas
        run: conftest verify --policy ../../policy

      # O código de saída é guardado para o comentário sair mesmo com violações;
      # o último passo é que derruba o job.
      - name: avalia as políticas no plan
        id: politicas
        run: |
          set +e
          conftest test plan.json --policy ../../policy --no-color > politicas.txt
          code=$?
          cat politicas.txt
          echo "code=${code}" >> "$GITHUB_OUTPUT"

      - name: comenta o plan no PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          POLITICAS_CODE: ${{ steps.politicas.outputs.code }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- terraform-plan -->';
            // O comentário do GitHub aceita até 65536 caracteres: plan e políticas dividem esse limite.
            const cortar = (texto, max) => texto.length > max ? texto.slice(0, max) + '\n... (truncado)' : texto;
            const plan = cortar(fs.readFileSync('envs/dev/plan.txt', 'utf8'), 50000);
            const politicas = cortar(fs.readFileSync('envs/dev/politicas.txt', 'utf8').trim(), 10000);
            const status = process.env.POLITICAS_CODE === '0' ? 'aprovado' : 'BLOQUEADO';
            const fence = '`'.repeat(3);
            const body = `${marker}\n### Terraform plan\n\n${fence}\n${plan}\n${fence}\n\n### Políticas (${status})\n\n${fence}\n${politicas}\n${fence}\n`;

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const previous = comments.find(c => c.body.startsWith(marker));
            if (previous) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: bloqueia se alguma política falhou
        if: steps.politicas.outputs.code != '0'
        run: |
          echo "O plan viola as políticas em policy/. Veja o comentário no PR."
          exit 1
