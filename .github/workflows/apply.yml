name: apply

on:
  push:
    branches: [main]
    paths:
      - "envs/**"
      - "modules/**"

# Nunca dois applies ao mesmo tempo no mesmo state. O segundo espera na fila.
concurrency:
  group: terraform-apply-dev
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  TF_IN_AUTOMATION: "true"
  TF_VAR_account_id: ${{ vars.AWS_ACCOUNT_ID }}

jobs:
  apply:
    runs-on: ubuntu-latest
    # O sub do OIDC vira "environment:production", o único aceito pela role de apply.
    # O environment exige aprovação manual antes de o job começar.
    environment: production
    defaults:
      run:
        working-directory: envs/dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false

      - name: init
        run: |
          terraform init -lockfile=readonly \
            -backend-config="bucket=${{ vars.STATE_BUCKET }}" \
            -backend-config="region=${AWS_REGION}"

      - name: plan
        run: terraform plan -out=plan.tfplan -no-color

      - name: plan em texto
        run: terraform show -no-color plan.tfplan | tee plan.txt >> "$GITHUB_STEP_SUMMARY"

      - name: guarda o plano aplicado
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plan-${{ github.sha }}
          path: envs/dev/plan.txt

      # Aplica o arquivo plan.tfplan, não "o que o código disser agora".
      # Se o state mudou desde o plan, o Terraform recusa o plano velho.
      - name: apply
        run: terraform apply -no-color plan.tfplan
